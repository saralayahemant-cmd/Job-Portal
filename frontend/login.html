<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – TalentBridge</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: var(--bg-surface); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    .auth-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 3rem; width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); }
    .auth-logo { margin-bottom: 2rem; text-align: center; }
    .auth-title { font-size: 1.75rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem; text-align: center; letter-spacing: -0.02em; }
    .auth-subtitle { color: var(--text-muted); text-align: center; margin-bottom: 2.5rem; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" class="nav-logo" style="display:inline-flex; border:none; background:none; box-shadow:none;">
        <div class="logo-icon">TB</div>
        TalentBridge
      </a>
    </div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to manage your career or team</p>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" class="form-control" placeholder="alex@company.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" class="form-control" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg" style="margin-top: 1rem;">Sign In</button>
    </form>

    <div style="margin-top: 2rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="register.html" style="color: var(--blue-600); font-weight: 600;">Sign up</a>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
